name: Daily News Digest

on:
  schedule:
    # 毎朝8時JST（UTC 23:00 = JST 08:00）
    - cron: '0 23 * * *'
  # 手動実行ボタンも有効化（テスト用）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install feedparser google-genai

      - name: ダイジェスト生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_digest.py

      - name: HTMLをdocsフォルダに移動
        run: |
          mkdir -p docs
          # 最新版をindex.htmlとして上書き（URLが毎日同じになる）
          cp digest_*.html docs/index.html
          # 日付入りのアーカイブも保存
          cp digest_*.html docs/

      - name: GitHub Pagesにコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "digest: $(date +'%Y-%m-%d')"
          git push
