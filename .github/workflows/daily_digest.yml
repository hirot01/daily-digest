name: Daily News Digest

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install feedparser google-generativeai

      - name: ダイジェスト生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_digest.py

      - name: HTMLをdocsフォルダに移動
        run: |
          mkdir -p docs
          cp digest_*.html docs/index.html
          cp digest_*.html docs/

      - name: GitHub Pagesにコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "digest: $(date +'%Y-%m-%d')"
          git push
