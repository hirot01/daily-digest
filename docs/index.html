<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デイリーニュースダイジェスト — 2026年05月07日（Thu）</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1a2e;
      --paper: #faf8f3;
      --accent: #c8570a;
      --accent2: #2d6a4f;
      --rule: #d4c5a9;
      --muted: #7a6f5e;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.7;
      padding: 0 16px 60px;
    }

    header {
      border-bottom: 3px double var(--ink);
      padding: 32px 0 20px;
      margin-bottom: 32px;
      text-align: center;
    }

    header .masthead {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--ink);
    }

    header .sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.08em;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--rule);
    }

    .stats-bar span { display: flex; align-items: center; gap: 4px; }

    main {
      max-width: 860px;
      margin: 0 auto;
    }

    .category {
      margin-bottom: 40px;
    }

    .category h2 {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.15rem;
      font-weight: 700;
      border-left: 4px solid var(--accent);
      padding-left: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category h2 .count {
      font-size: 0.75rem;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      color: var(--muted);
      background: var(--rule);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 12px;
      transition: box-shadow 0.2s;
    }

    .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .source {
      font-weight: 500;
      color: var(--accent2);
    }

    .stars {
      color: #c8a400;
      letter-spacing: -1px;
    }

    .card h3 {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .card h3 a {
      color: var(--ink);
      text-decoration: none;
    }

    .card h3 a:hover { color: var(--accent); text-decoration: underline; }

    .summary-ja {
      font-size: 0.875rem;
      color: #3a3530;
      line-height: 1.75;
      border-top: 1px solid var(--rule);
      padding-top: 8px;
      margin-top: 4px;
    }

    .no-news {
      text-align: center;
      color: var(--muted);
      padding: 40px;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
    }
  </style>
</head>
<body>
  <header>
    <div class="masthead">📋 デイリーニュースダイジェスト</div>
    <div class="sub">2026年05月07日（Thu）　｜　業界ニュースダイジェスト</div>
    <div class="stats-bar">
      <span>📡 取得記事数: 39件</span>
      <span>🔍 キーワード候補: 0件</span>
      <span>✅ 掲載: 0件</span>
    </div>
  </header>

  <main>
    <p class="no-news">本日、関連ニュースは見つかりませんでした。</p>
  </main>

  <footer>
    生成: 2026-05-07 14:00 JST　｜　ソース: RSS自動巡回 + Claude AI要約
  </footer>
</body>
</html>
